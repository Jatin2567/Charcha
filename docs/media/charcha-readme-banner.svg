<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Charcha — one conversation, one shared plan</title>
  <desc id="desc">Royal blue and charcoal banner with an illustrated message correction from room three to room four, followed by an acknowledgement of version two.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d23"/>
      <stop offset="1" stop-color="#28375f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#365bd6"/>
      <stop offset="1" stop-color="#2847b3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#background)"/>
  <circle cx="1112" cy="0" r="296" fill="none" stroke="#8194bd" stroke-opacity=".12"/>
  <circle cx="1112" cy="0" r="244" fill="none" stroke="#8194bd" stroke-opacity=".12"/>
  <circle cx="1112" cy="0" r="192" fill="none" stroke="#8194bd" stroke-opacity=".12"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(48 44)">
      <rect width="46" height="46" rx="14" fill="url(#blue)"/>
      <path d="M13 16h20v13H23l-7 6v-6h-3z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="60" y="33" fill="#ffffff" font-size="33" font-weight="700" letter-spacing="-.7">Charcha</text>
    </g>
    <text x="48" y="150" fill="#cbd8ff" font-size="12" font-weight="700" letter-spacing="2.5">MULTILINGUAL MEETINGS · BUILT USING GNANI AI</text>
    <text x="45" y="210" fill="#ffffff" font-size="48" font-weight="700" letter-spacing="-1.5">One conversation.</text>
    <text x="45" y="267" fill="#ffffff" font-size="48" font-weight="700" letter-spacing="-1.5">One shared plan.</text>
    <text x="48" y="313" fill="#c1c9d8" font-size="18">Speak in your language. Review the change.</text>
    <text x="48" y="340" fill="#c1c9d8" font-size="18">Keep the original, the correction and the recap.</text>
    <text x="48" y="391" fill="#9db4ff" font-size="12" font-weight="600" letter-spacing="1.3">VOICE + CAPTIONS + VERSIONED CORRECTIONS</text>
    <g transform="translate(670 53)">
      <text x="0" y="0" fill="#cbd8ff" font-size="11" font-weight="700" letter-spacing="2">ILLUSTRATED WORKFLOW</text>
      <rect y="21" width="480" height="80" rx="16" fill="#30343d" stroke="#56698f"/>
      <circle cx="35" cy="61" r="17" fill="#465069"/>
      <text x="35" y="66" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">01</text>
      <text x="65" y="51" fill="#c1c9d8" font-size="11" font-weight="600" letter-spacing="1.2">ORIGINAL · VERSION 1</text>
      <text x="65" y="79" fill="#f3f5fa" font-size="21" font-weight="600">Meet in room three.</text>
      <path d="M35 105v16m-5-5 5 5 5-5" fill="none" stroke="#829bef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect y="128" width="480" height="80" rx="16" fill="url(#blue)" stroke="#829bef"/>
      <circle cx="35" cy="168" r="17" fill="#ffffff" fill-opacity=".16"/>
      <text x="35" y="173" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">02</text>
      <text x="65" y="158" fill="#eaf0ff" font-size="11" font-weight="600" letter-spacing="1.2">CORRECTION · VERSION 2</text>
      <text x="65" y="186" fill="#ffffff" font-size="21" font-weight="600">Room four, not room three.</text>
      <path d="M35 212v16m-5-5 5 5 5-5" fill="none" stroke="#829bef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect y="235" width="480" height="80" rx="16" fill="#eaf0ff"/>
      <circle cx="35" cy="275" r="17" fill="#365bd6"/>
      <path d="m28 275 5 5 9-10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="265" fill="#365bd6" font-size="11" font-weight="700" letter-spacing="1.2">ACKNOWLEDGE THE UPDATED VERSION</text>
      <text x="65" y="293" fill="#24272e" font-size="21" font-weight="600">Keep both versions in the recap.</text>
    </g>
  </g>
</svg>
