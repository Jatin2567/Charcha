services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      USAGE_DB_PATH: /app/data/usage.sqlite3
    volumes: ['usage-ledger:/app/data']
    ports: ['127.0.0.1:8000:8000']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ['127.0.0.1:8080:80']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:v1.9.1
    profiles: ['local-livekit']
    command: ['--dev', '--bind', '0.0.0.0', '--node-ip', '127.0.0.1']
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:7882:7882/udp'
# Evon is deliberately a separate, pinned and authenticated GPU deployment.
# Generate its configuration with scripts/evon_prepare.py; see docs/GPU_TESTING.md.
volumes:
  usage-ledger:
