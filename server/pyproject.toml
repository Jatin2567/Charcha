[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "artha-mesh-server"
version = "0.1.0"
description = "Indic conversation interpretation with consented voice cloning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "websockets>=14.1,<16.0",
  "python-multipart>=0.0.20,<1.0",
  "livekit-api>=1.0,<2.0",
  "livekit>=1.0,<2.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
live = [] # RTC dependencies are included so the installed app always supports live mode.
screening = ["onnxruntime>=1.22,<2.0"] # Optional local CPU classifier; never an API.
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["artha_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
